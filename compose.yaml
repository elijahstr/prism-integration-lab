services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: prism_integration_lab
      POSTGRES_PASSWORD: prism
      POSTGRES_USER: prism
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism_integration_lab"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
