services:
  - type: web
    name: prism-integration-lab
    runtime: node
    plan: free
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: bun run scripts/start-public.ts
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: BUN_VERSION
        value: 1.3.11
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LAB_TOKEN_PEPPER
        sync: false
      - key: PROVIDER_KEY_MASTER_SECRET
        sync: false
